<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higor — Programador Full Stack</title>
    <style>
      :root {
        --cream: #f4f1ea;
        --cream-alt: #eee9df;
        --ink: #221e19;
        --ink-soft: #4a443c;
        --rust: #b5522b;
        --rust-soft: #c96a3e;
        --line: #d9d2c4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--cream);
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }

      .sans {
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      /* HERO */
      .hero {
        padding: 72px 24px 88px;
        text-align: center;
        max-width: 760px;
        margin: 0 auto;
      }

      .hero h1 {
        font-size: clamp(40px, 8vw, 68px);
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: -0.5px;
      }

      .hero h1 em {
        font-style: italic;
      }

      .hero p.lede {
        margin-top: 28px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
        line-height: 1.6;
        color: var(--ink-soft);
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }

      .cta {
        display: inline-block;
        margin-top: 44px;
        font-family: "Iowan Old Style", Georgia, serif;
        font-style: italic;
        font-size: 20px;
        color: var(--rust);
        text-decoration: none;
        border-bottom: 1px solid var(--rust);
        padding-bottom: 4px;
      }

      .cta:hover {
        color: var(--rust-soft);
        border-color: var(--rust-soft);
      }

      /* PORTFOLIO */
      .portfolio {
        background: var(--cream-alt);
        padding: 96px 24px 120px;
        border-top: 1px solid var(--line);
      }

      .portfolio-head {
        text-align: center;
        max-width: 560px;
        margin: 0 auto 64px;
      }

      .portfolio-head h2 {
        font-size: clamp(32px, 5vw, 44px);
        font-weight: 400;
        color: var(--rust);
      }

      .portfolio-head p {
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        margin-top: 14px;
        color: var(--ink-soft);
        font-size: 17px;
      }

      .grid {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px 24px;
      }

      .card {
        display: block;
      }

      .thumb {
        aspect-ratio: 4 / 3;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .caption {
        margin-top: 14px;
        font-size: 16px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .caption em {
        font-family: "Iowan Old Style", Georgia, serif;
        font-style: italic;
      }

      @media (max-width: 780px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .hero {
          padding: 56px 20px 64px;
        }
        .portfolio {
          padding: 72px 20px 88px;
        }
      }
    </style>
  </head>

  <body>
    <section class="hero">
      <h1>Olá, eu sou o <em>Higor!</em></h1>
      <p class="lede">
        Sou programador full stack. Transformo ideias em produtos rápidos,
        funcionais e bem construídos — do banco de dados à interface.
      </p>
      <a class="cta" href="#contato">Fale comigo</a>
    </section>

    <section class="portfolio">
      <div class="portfolio-head">
        <h2>Portfólio</h2>
        <p>Alguns dos projetos que desenvolvi</p>
      </div>

      <div class="grid">
        <a
          class="card"
          href="https://bhigoreduardofinance-app.vercel.app/"
          target="_blank"
        >
          <div class="thumb">
            <img src="/assets/img/finance-app.png" alt="Finance App" />
          </div>
          <p class="caption"><em>Finance App</em></p>
        </a>
        <a
          class="card"
          href="https://regionaldigitalnews.com.br/"
          target="_blank"
        >
          <div class="thumb">
            <img src="/assets/img/regional-news.png" alt="Finance App" />
          </div>
          <p class="caption"><em>Regional News</em></p>
        </a>
        <a class="card" href="#">
          <div class="thumb">
            <img src="https://placehold.co/400x400" alt="Furniture App" />
          </div>
          <p class="caption"><em>Furniture App</em></p>
        </a>
        <a class="card" href="#">
          <div class="thumb">
            <img src="https://placehold.co/400x400" alt="Solar App" />
          </div>
          <p class="caption"><em>Solar App</em></p>
        </a>
      </div>
    </section>
  </body>
</html>
